<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eShop</title>
    <style>
      body {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 15px;
        background: #f5f5f5;
        color: #222;
        font: 16px Arial, sans-serif;
      }
      h1 { margin-bottom: 24px; }
      section {
        margin: 12px 0;
        padding: 15px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      input, button { margin: 4px; padding: 8px; }
      button {
        cursor: pointer;
        border: 1px solid #999;
        border-radius: 4px;
        background: #eee;
      }
      button:hover { background: #ddd; }
      li { margin: 8px 0; }
      b { margin-left: 8px; color: #176b35; }
    </style>
  </head>
  <body>
    <h1>Online Shopping and Order Management</h1>
    <section>
      <h2>Customer registration / login</h2>
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
      <b id="status"></b>
    </section>
    <section>
      <h2>Product catalogue</h2>
      <input id="search" placeholder="Search products" oninput="load()">
      <ul id="products"></ul>
    </section>
    <section>
      <h2>Cart</h2>
      <ul id="cart"></ul>
      <button onclick="checkoutOrder()">Checkout</button>
      <b id="checkoutMessage"></b>
    </section>
    <section>
      <h2>Order history</h2>
      <button onclick="history()">View orders</button>
      <ul id="orders"></ul>
    </section>
    <section>
      <h2>Admin product management</h2>
      <input id="newName" placeholder="Product name">
      <input id="newPrice" type="number" placeholder="Price">
      <button onclick="addProduct()">Add product</button>
    </section>
    <script>
      let cart = [];
      let productsData = [];
      const api = async (url, options) => {
        const response = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options
        });
        return response.json();
      };
      async function register() {
        const result = await api("/api/register", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        document.getElementById("status").textContent = result.message;
      }
      async function login() {
        const result = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        document.getElementById("status").textContent = result.message;
      }
      async function load() {
        const query = encodeURIComponent(document.getElementById("search").value);
        const result = await api("/api/products?q=" + query);
        document.getElementById("products").innerHTML = result
          .map(product => "<li>" + product.name + " - $" + product.price +
            ' <button onclick="add(' + product.id + ')">Add to cart</button></li>')
          .join("");
      }
      function add(id) {
        const product = productsData.find(item => item.id === id);
        const item = cart.find(cartItem => cartItem.id === id);
        item ? item.qty++ : cart.push({
          id: product.id, name: product.name, price: product.price, qty: 1
        });
        renderCart();
        document.getElementById("checkoutMessage").textContent = "Product added";
      }
      async function refresh() {
        productsData = await api("/api/products");
        load();
      }
      function renderCart() {
        document.getElementById("cart").innerHTML = cart
          .map(item => '<li>' + item.name + ' x <input aria-label="' + item.name +
            ' quantity" type="number" min="1" value="' + item.qty +
            '" onchange="qty(' + item.id + ', this.value)">' +
            ' <button onclick="removeItem(' + item.id + ')">Remove</button></li>')
          .join("");
      }
      function qty(id, quantity) {
        cart.find(item => item.id === id).qty = +quantity;
        renderCart();
        document.getElementById("checkoutMessage").textContent = "Cart updated";
      }
      function removeItem(id) {
        cart = cart.filter(item => item.id !== id);
        renderCart();
        document.getElementById("checkoutMessage").textContent = "Product removed";
      }
      async function checkoutOrder() {
        if (!cart.length) return;
        const result = await api("/api/orders", {
          method: "POST",
          body: JSON.stringify({ items: cart })
        });
        cart = [];
        renderCart();
        document.getElementById("checkoutMessage").textContent = result.message;
      }
      async function history() {
        const result = await api("/api/orders");
        document.getElementById("orders").innerHTML = result
          .map(order => "<li>Order #" + order.id + " - $" + order.total + "</li>")
          .join("");
      }
      async function addProduct() {
        const result = await api("/api/products", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("newName").value,
            price: +document.getElementById("newPrice").value
          })
        });
        document.getElementById("status").textContent = result.message;
        refresh();
      }
      refresh();
    </script>
  </body>
</html>
